<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happiest Birthday</title>

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>
    <p id="playMusicText" class="play-music">
    🎵 Click here to play music
</p>

    <!-- Background Animation -->

    <div class="background">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

   

    <!-- Hero Section -->

    <section id="hero"
             class="hero">

        <!-- Left Side -->

        <div class="hero-content">

            <h4>

                ✨ A Special Day ✨

            </h4>

            <h1>

                Happiest Birthday
                <span>Jay</span>

            </h1>

            <h2>

                Celebrating
                <span>23 Amazing Years</span>

                of Happiness 🎉

            </h2>

            <p>

                May god bless uh and all your dreams comes true. 
                Bless you with long healthy and wealthy life ahead. 
                Best wishes tons of happiness and loads of love. 
                Enjoy your day. 

            </p>



        </div>

        <!-- Right Side -->

        <div class="hero-image">

            <div class="image-card">

                <div class="glow-circle"></div>

                <img src="j.jpg"
                     alt="Birthday Photo">

            </div>

        </div>

    </section>

    
    <!-- Floating Balloons -->

    <div class="balloons">

        <div class="balloon red"></div>
        <div class="balloon blue"></div>
        <div class="balloon yellow"></div>
        <div class="balloon green"></div>

    </div>

    <!-- Confetti Container -->

    <div id="confetti"></div>

    

    <!-- JavaScript -->

    <script src="script.js"></script>


    <div class="fireworks">
    <div class="firework f1"></div>
    <div class="firework f2"></div>
    <div class="firework f3"></div>
    <div class="firework f4"></div>
    <div class="firework f5"></div>
</div>

    <audio id="bgMusic" loop>
    <source src="Instrumental.mp3" type="audio/mpeg">
</audio>

</body>

</html>
